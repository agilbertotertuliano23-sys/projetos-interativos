  <script>
  const PROGRAMAS = {
    soma: ['Soma de 1 a N (while)', 'n = 5\nsoma = 0\ni = 1\nwhile i <= n:\n    soma = soma + i\n    i = i + 1\nprint("A soma é", soma)'],
    tabuada: ['Tabuada (for e range)', 'numero = 7\nfor i in range(1, 6):\n    resultado = numero * i\n    print(numero, "x", i, "=", resultado)'],
    par: ['Par ou ímpar (if/else)', 'numeros = [4, 7, 10, 13]\nfor x in numeros:\n    if x % 2 == 0:\n        print(x, "é par")\n    else:\n        print(x, "é ímpar")'],
    maior: ['Maior nota da lista', 'notas = [6.5, 8, 9.5, 7]\nmaior = notas[0]\nfor nota in notas:\n    if nota > maior:\n        maior = nota\nprint("Maior nota:", maior)'],
    fatorial: ['Fatorial recursivo (funções)', 'def fatorial(n):\n    if n <= 1:\n        return 1\n    return n * fatorial(n - 1)\n\nresultado = fatorial(4)\nprint("4! =", resultado)'],
    fib: ['Fibonacci com lista', 'fib = [0, 1]\nwhile len(fib) < 8:\n    proximo = fib[-1] + fib[-2]\n    fib.append(proximo)\nprint(fib)'],
    vogais: ['Contar vogais (strings)', 'palavra = "programação"\nvogais = 0\nfor letra in palavra:\n    if letra in "aeiouáéíóúãõâêô":\n        vogais += 1\nprint("Vogais:", vogais)'],
    alias: ['Duas variáveis, uma lista', 'a = [1, 2, 3]\nb = a\nb.append(4)\nc = a + [5]\nprint(a)\nprint(c)'],
  };

  // ================= mini-interpretador (subconjunto de Python) =================
  class ErroPy extends Error { constructor(msg, linha) { super(msg); this.linha = linha; } }
  class Sinal { constructor(tipo, valor) { this.tipo = tipo; this.valor = valor; } }
  const TOK = /\s*(?:(\d+\.\d*|\.\d+|\d+)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|([A-Za-z_À-ÿ][\wÀ-ÿ]*)|(\*\*|\/\/|==|!=|<=|>=|\+=|-=|\*=|\/=|[-+*\/%<>=()[\],:.]))/y;
  const PALAVRAS = new Set(['def', 'if', 'elif', 'else', 'while', 'for', 'in', 'return', 'break', 'continue', 'pass', 'and', 'or', 'not', 'True', 'False', 'None']);
  function semComentario(l) { let q = null; for (let i = 0; i < l.length; i++) { const c = l[i]; if (q) { if (c === '\\') i++; else if (c === q) q = null; } else if (c === '"' || c === "'") q = c; else if (c === '#') return l.slice(0, i); } return l; }
  function tokenizar(linha, n) {
    const out = []; TOK.lastIndex = 0; let m;
    while (TOK.lastIndex < linha.length) {
      if (/^\s*$/.test(linha.slice(TOK.lastIndex))) break;
      const ini = TOK.lastIndex; m = TOK.exec(linha);
      if (!m) throw new ErroPy(`Erro de sintaxe: caractere inesperado “${linha.slice(ini).trim()[0]}”`, n);
      const p0 = ini + m[0].length - (m[1] ?? m[2] ?? m[3] ?? m[4]).length;
      if (m[1]) out.push({ t: 'num', v: parseFloat(m[1]), s: m[1], p: p0 });
      else if (m[2]) out.push({ t: 'str', v: m[2].slice(1, -1).replace(/\\n/g, '\n').replace(/\\(.)/g, '$1'), s: m[2], p: p0 });
      else if (m[3]) out.push({ t: PALAVRAS.has(m[3]) ? 'kw' : 'nome', v: m[3], s: m[3], p: p0 });

    }
    return out;
  }
  function analisar(fonte) {
    const linhas = [];
    fonte.replace(/\t/g, '    ').split('\n').forEach((bruta, i) => { const l = semComentario(bruta); if (!l.trim()) return; linhas.push({ ind: l.match(/^ */)[0].length, toks: tokenizar(l, i + 1), n: i + 1, txt: l }); });
    let k = 0;
    function bloco(ind) {
      const out = [];
      while (k < linhas.length && linhas[k].ind === ind) out.push(stmt(ind));
      if (k < linhas.length && linhas[k].ind > ind) throw new ErroPy('Erro de indentação: recuo inesperado', linhas[k].n);

    }
    function corpo(L, ind) { if (k >= linhas.length || linhas[k].ind <= ind) throw new ErroPy('Erro de indentação: o bloco depois de “:” precisa estar recuado', L.n); return bloco(linhas[k].ind); }

      const L = linhas[k++], P = parserExpr(L), t0 = L.toks[0];
      const fimDois = () => { if (!P.eh('op', ':')) throw new ErroPy('Erro de sintaxe: faltou “:” no fim da linha', L.n); P.prox(); if (!P.fim()) throw new ErroPy('Erro de sintaxe: algo sobrando depois de “:”', L.n); };
      if (t0.t === 'kw') {
        if (t0.v === 'def') { P.prox(); const nome = P.prox(); if (nome.t !== 'nome') throw new ErroPy('Erro de sintaxe: nome da função', L.n); P.espera('('); const params = []; while (!P.eh('op', ')')) { params.push(P.prox().v); if (P.eh('op', ',')) P.prox(); } P.espera(')'); fimDois(); return { t: 'def', nome: nome.v, params, corpo: corpo(L, ind), linha: L.n }; }
        if (t0.v === 'if') { P.prox(); const cond = P.expr(); fimDois(); const ramos = [{ cond, corpo: corpo(L, ind), linha: L.n }]; let senao = null, linhaSenao = null;
          while (k < linhas.length && linhas[k].ind === ind && linhas[k].toks[0].t === 'kw' && (linhas[k].toks[0].v === 'elif' || linhas[k].toks[0].v === 'else')) { const L2 = linhas[k++], P2 = parserExpr(L2); P2.prox(); if (L2.toks[0].v === 'elif') { const c2 = P2.expr(); if (!P2.eh('op', ':')) throw new ErroPy('faltou “:”', L2.n); ramos.push({ cond: c2, corpo: corpo(L2, ind), linha: L2.n }); } else { if (!P2.eh('op', ':')) throw new ErroPy('faltou “:”', L2.n); senao = corpo(L2, ind); linhaSenao = L2.n; break; } }
          return { t: 'if', ramos, senao, linhaSenao, linha: L.n }; }
        if (t0.v === 'while') { P.prox(); const cond = P.expr(); fimDois(); return { t: 'while', cond, corpo: corpo(L, ind), linha: L.n }; }
        if (t0.v === 'for') { P.prox(); const v = P.prox(); if (v.t !== 'nome') throw new ErroPy('Erro de sintaxe no for', L.n); if (!(P.eh('kw', 'in'))) throw new ErroPy('Erro de sintaxe: esperado “in” no for', L.n); P.prox(); const it = P.expr(); fimDois(); return { t: 'for', var: v.v, iter: it, corpo: corpo(L, ind), linha: L.n }; }
        if (t0.v === 'return') { P.prox(); const e = P.fim() ? null : P.expr(); return { t: 'return', expr: e, linha: L.n }; }
        if (t0.v === 'break' || t0.v === 'continue' || t0.v === 'pass') return { t: t0.v, linha: L.n };
        if (t0.v === 'elif' || t0.v === 'else') throw new ErroPy(`“${t0.v}” sem um “if” antes`, L.n);
      }
      const e = P.expr();
      if (P.eh('op', '=') || P.eh('op', '+=') || P.eh('op', '-=') || P.eh('op', '*=') || P.eh('op', '/=')) { const op = P.prox().v; if (e.t !== 'nome' && e.t !== 'idx') throw new ErroPy('Não dá para atribuir a essa expressão', L.n); const v = P.expr(); if (!P.fim()) throw new ErroPy('Erro de sintaxe', L.n); return { t: 'atrib', alvo: e, op, expr: v, linha: L.n }; }
      if (!P.fim()) throw new ErroPy(`Erro de sintaxe perto de “${P.olha().s}”`, L.n);
      return { t: 'expr', expr: e, linha: L.n };
    }
    const prog = bloco(0);
    if (k < linhas.length) throw new ErroPy('Erro de indentação', linhas[k].n);
    return prog;
  }
  function parserExpr(L) {
    const T = L.toks; let i = 0;
    const P = {
      olha: () => T[i], fim: () => i >= T.length, prox: () => { if (i >= T.length) throw new ErroPy('Erro de sintaxe: linha incompleta', L.n); return T[i++]; },
      eh: (t, v) => i < T.length && T[i].t === t && T[i].v === v,
      espera: (v) => { if (!P.eh('op', v)) throw new ErroPy(`Erro de sintaxe: esperado “${v}”`, L.n); i++; },
      src: (a, b) => L.txt.slice(T[a].p, T[b - 1].p + T[b - 1].s.length),
      expr() { return ou(); },
    };
    const no = (o, a) => ((o.src = P.src(a, i)), o);
    function ou() { const a = i; let e = e_(); while (P.eh('kw', 'or')) { P.prox(); e = no({ t: 'bin', op: 'or', a: e, b: e_() }, a); } return e; }
    function e_() { const a = i; let e = nao(); while (P.eh('kw', 'and')) { P.prox(); e = no({ t: 'bin', op: 'and', a: e, b: nao() }, a); } return e; }
    function nao() { const a = i; if (P.eh('kw', 'not')) { P.prox(); return no({ t: 'un', op: 'not', a: nao() }, a); } return comp(); }
    function comp() { const a = i; let e = soma(); for (;;) { let op = null; if (i < T.length && T[i].t === 'op' && ['==', '!=', '<', '>', '<=', '>='].includes(T[i].v)) op = P.prox().v; else if (P.eh('kw', 'in')) { P.prox(); op = 'in'; } else if (P.eh('kw', 'not') && T[i + 1] && T[i + 1].v === 'in') { i += 2; op = 'not in'; } if (!op) break; e = no({ t: 'bin', op, a: e, b: soma() }, a); } return e; }
    function soma() { const a = i; let e = mult(); while (i < T.length && T[i].t === 'op' && (T[i].v === '+' || T[i].v === '-')) { const op = P.prox().v; e = no({ t: 'bin', op, a: e, b: mult() }, a); } return e; }
    function mult() { const a = i; let e = unario(); while (i < T.length && T[i].t === 'op' && ['*', '/', '//', '%'].includes(T[i].v)) { const op = P.prox().v; e = no({ t: 'bin', op, a: e, b: unario() }, a); } return e; }
    function unario() { const a = i; if (P.eh('op', '-')) { P.prox(); return no({ t: 'un', op: '-', a: unario() }, a); } if (P.eh('op', '+')) { P.prox(); return unario(); } return pot(); }
    function pot() { const a = i; const b = posfixo(); if (P.eh('op', '**')) { P.prox(); return no({ t: 'bin', op: '**', a: b, b: unario() }, a); } return b; }
    function posfixo() {
      const a = i; let e = atomo();
      for (;;) {
        if (P.eh('op', '(')) { P.prox(); const args = []; while (!P.eh('op', ')')) { args.push(P.expr()); if (P.eh('op', ',')) P.prox(); else if (!P.eh('op', ')')) throw new ErroPy('Erro de sintaxe: esperado “,” ou “)”', L.n); } P.prox(); e = no({ t: 'call', f: e, args }, a); }
        else if (P.eh('op', '[')) { P.prox(); const ix = P.expr(); P.espera(']'); e = no({ t: 'idx', a: e, i: ix }, a); }
        else if (P.eh('op', '.')) { P.prox(); const n = P.prox(); if (n.t !== 'nome') throw new ErroPy('Erro de sintaxe depois de “.”', L.n); e = no({ t: 'attr', a: e, nome: n.v }, a); }
        else break;
      }
      return e;
    }
    function atomo() {
      const a = i, t = P.prox();
      if (t.t === 'num') return no({ t: 'num', v: t.v }, a);
      if (t.t === 'str') return no({ t: 'str', v: t.v }, a);
      if (t.t === 'nome') return no({ t: 'nome', n: t.v }, a);
      if (t.t === 'kw' && ['True', 'False', 'None'].includes(t.v)) return no({ t: 'const', v: t.v === 'True' ? true : t.v === 'False' ? false : null }, a);
      if (t.t === 'op' && t.v === '(') { const e = P.expr(); P.espera(')'); return e; }
      if (t.t === 'op' && t.v === '[') { const itens = []; while (!P.eh('op', ']')) { itens.push(P.expr()); if (P.eh('op', ',')) P.prox(); else if (!P.eh('op', ']')) throw new ErroPy('Erro de sintaxe na lista', L.n); } P.prox(); return no({ t: 'lista', itens }, a); }
      throw new ErroPy(`Erro de sintaxe perto de “${t.s}”`, L.n);
    }
    return P;
  }
  const repr = (v) => (v === null ? 'None' : v === true ? 'True' : v === false ? 'False' : typeof v === 'string' ? `'${v}'` : Array.isArray(v) ? `[${v.map(repr).join(', ')}]` : typeof v === 'number' ? (Number.isInteger(v) ? String(v) : String(+v.toFixed(6))) : v && v.func ? `<função ${v.func.nome}>` : v && v.builtin ? `<função ${v.builtin}>` : String(v));
  const strPy = (v) => (typeof v === 'string' ? v : repr(v));
  const verdade = (v) => !(v === null || v === false || v === 0 || v === '' || (Array.isArray(v) && !v.length));
  const igual = (a, b) => (Array.isArray(a) && Array.isArray(b) ? a.length === b.length && a.every((x, k) => igual(x, b[k])) : a === b);

  function criarMaquina(prog) {
    const M = { pilha: [{ nome: 'Global', vars: new Map() }], saida: [], passos: 0, conds: {}, voltas: {}, notas: new Set() };
    const atual = () => M.pilha[M.pilha.length - 1];
    const BUILTINS = {
      print: (args) => { M.saida.push(args.map(strPy).join(' ')); return null; },
      len: ([x], l) => { if (typeof x !== 'string' && !Array.isArray(x)) throw new ErroPy(`TypeError: len() não funciona com ${repr(x)}`, l); return x.length; },
      range: (a, l) => { const [i0, i1, p] = a.length === 1 ? [0, a[0], 1] : [a[0], a[1], a[2] ?? 1]; if (!p) throw new ErroPy('range() com passo 0', l); const out = []; for (let k = i0; p > 0 ? k < i1 : k > i1; k += p) { out.push(k); if (out.length > 5000) throw new ErroPy('range grande demais para visualizar', l); } return out; },
      str: ([x]) => strPy(x), int: ([x], l) => { const v = typeof x === 'string' ? parseInt(x, 10) : Math.trunc(x); if (Number.isNaN(v)) throw new ErroPy(`ValueError: não dá para converter ${repr(x)} em int`, l); return v; },
      float: ([x]) => parseFloat(x), abs: ([x]) => Math.abs(x), round: ([x, n]) => (n ? +x.toFixed(n) : Math.round(x)),
      max: (a) => (a.length === 1 && Array.isArray(a[0]) ? Math.max(...a[0]) : Math.max(...a)), min: (a) => (a.length === 1 && Array.isArray(a[0]) ? Math.min(...a[0]) : Math.min(...a)), sum: ([x]) => x.reduce((s, v) => s + v, 0),
    };
    function busca(n, l) { const f = atual(); if (f.vars.has(n)) return f.vars.get(n); const g = M.pilha[0].vars; if (g.has(n)) return g.get(n); if (BUILTINS[n]) return { builtin: n }; throw new ErroPy(`NameError: a variável “${n}” não foi definida`, l); }
    function opBin(op, a, b, l) {
      const num = (x) => typeof x === 'number' || typeof x === 'boolean';
      switch (op) {
        case '+': if (num(a) && num(b)) return a + b; if (typeof a === 'string' && typeof b === 'string') return a + b; if (Array.isArray(a) && Array.isArray(b)) return [...a, ...b]; break;
        case '-': if (num(a) && num(b)) return a - b; break;
        case '*': if (num(a) && num(b)) return a * b; if (typeof a === 'string' && Number.isInteger(b)) return a.repeat(Math.max(0, b)); if (Array.isArray(a) && Number.isInteger(b)) return Array.from({ length: Math.max(0, b) }, () => a).flat(); break;
        case '/': if (num(a) && num(b)) { if (!b) throw new ErroPy('ZeroDivisionError: divisão por zero', l); return a / b; } break;
        case '//': if (num(a) && num(b)) { if (!b) throw new ErroPy('ZeroDivisionError: divisão por zero', l); return Math.floor(a / b); } break;
        case '%': if (num(a) && num(b)) { if (!b) throw new ErroPy('ZeroDivisionError: divisão por zero', l); return ((a % b) + b) % b; } break;

        case 'in': if (typeof b === 'string') return b.includes(a); if (Array.isArray(b)) return b.some((x) => igual(x, a)); break;

        case 'lista': { const r = []; for (const it of n.itens) r.push(yield* ev(it, l)); return r; }
        case 'un': { const v = yield* ev(n.a, l); return n.op === 'not' ? !verdade(v) : -v; }
        case 'bin': { if (n.op === 'and') { const a = yield* ev(n.a, l); return verdade(a) ? yield* ev(n.b, l) : a; } if (n.op === 'or') { const a = yield* ev(n.a, l); return verdade(a) ? a : yield* ev(n.b, l); } const a = yield* ev(n.a, l), b = yield* ev(n.b, l); return opBin(n.op, a, b, l); }
        case 'idx': { const a = yield* ev(n.a, l); let k = yield* ev(n.i, l); if (typeof a !== 'string' && !Array.isArray(a)) throw new ErroPy(`TypeError: ${repr(a)} não tem índices`, l); if (k < 0) k += a.length; if (k < 0 || k >= a.length || !Number.isInteger(k)) throw new ErroPy(`IndexError: índice ${k} fora da lista (tamanho ${a.length})`, l); return a[k]; }

    function* chamar(def, args, l) {
