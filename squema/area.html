<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área — SQUEMA</title>
  <meta name="theme-color" content="#1F5BE0">
  <link rel="icon" href="assets/icones/mapa.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/squema.css">
  <style>
    .area-cabeca { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 28px; align-items: center; padding: 30px 0 10px; }
    .area-cabeca .titulo { display: flex; gap: 18px; align-items: center; }
    .area-cabeca h1 { color: #fff; text-shadow: 0 4px 0 var(--azul-escuro); margin: 0; }
    .area-cabeca p { color: #DCE8FF; font-size: 18px; margin: 12px 0 14px; }
    .radial { padding: 8px; }
    .radial svg { width: 100%; height: auto; display: block; }
    .radial .no-centro circle { fill: var(--cor-area); stroke: var(--tinta); stroke-width: 4; }
    .radial .no { cursor: pointer; }
    .radial .no rect { stroke: var(--tinta); stroke-width: 3; }
    .radial .no:hover rect, .radial .no:focus rect { fill: var(--amarelo); }
    .radial .no:focus { outline: none; }
    .radial text { font: 800 14px var(--fonte); fill: var(--tinta); }
    .radial .ligacao { stroke: var(--tinta); stroke-width: 3; stroke-dasharray: 2 7; stroke-linecap: round; }
    .radial .ligacao.pronta { stroke-dasharray: none; }
    .legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; font-weight: 800; color: var(--texto-suave); padding: 0 12px 6px; }
    .legenda span::before { content: ""; display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--tinta); vertical-align: middle; margin-right: 6px; }
    .legenda span.r::before { border-top-style: dotted; }

    .caso { scroll-margin-top: 90px; }
    .caso + .caso { margin-top: 22px; }
    .caso-topo { display: flex; gap: 12px; align-items: start; justify-content: space-between; flex-wrap: wrap; }
    .caso h2 { margin: 0 0 4px; font-size: 26px; }
    .caso .resumo { color: var(--texto-suave); margin: 6px 0 16px; max-width: 860px; }
    .caso .base { display: grid; grid-template-columns: 1fr 1fr auto; gap: 20px; margin-top: 18px; align-items: start; }
    .caso ul, .caso ol { margin: 0; padding-left: 20px; }
    .caso li { margin-bottom: 3px; }
    .caso .acao { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 200px; }
    @media (max-width: 900px) { .area-cabeca { grid-template-columns: 1fr; } .caso .base { grid-template-columns: 1fr; } }
    .outras { display: flex; flex-wrap: wrap; gap: 8px; }
    .outras a { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 2px solid var(--tinta); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 800; font-size: 14px; color: var(--tinta); box-shadow: 0 3px 0 var(--azul-escuro); }
    .outras a img { width: 26px; height: 26px; object-fit: contain; }
    .outras a[aria-current] { background: var(--amarelo); }
  </style>
</head>
<body data-raiz="">
  <noscript><p style="background:#fff;padding:16px;margin:0">Ative o JavaScript para ver os esquemas.</p></noscript>
  <script src="js/catalogo.js"></script>
  <script src="js/squema.js"></script>
  <script>
  (function () {
    const { el, esc, estrelas, iconeArea, dados, maiuscula } = SQ;
    const id = new URLSearchParams(location.search).get('a') || 'biologia';
    const area = dados.areaPorId[id] || dados.AREAS[0];
    const sistemas = dados.sistemasDaArea(area.id);
    document.title = `${area.nome} — esquemas e demonstrações · SQUEMA`;
    document.documentElement.style.setProperty('--cor-area', area.cor);
    const pagina = SQ.moldura({ ativo: 'areas', trilha: [{ rotulo: 'Áreas', href: 'index.html#areas' }, { rotulo: area.nome }] });

    // ---------- esquema radial da área ----------
    const W = 460, H = 330, cx = W / 2, cy = H / 2;
    const n = sistemas.length;
    const nos = sistemas.map((s, i) => {
      const ang = n === 1 ? -Math.PI / 2 : -Math.PI / 2 + (i / n) * Math.PI * 2;
      const rx = n <= 2 ? 150 : 158, ry = n <= 2 ? 105 : 118;
      return { s, x: cx + Math.cos(ang) * rx, y: cy + Math.sin(ang) * ry };
    });
    const linhas = (t) => {
      if (t.length <= 15) return [t];
      const meio = t.length / 2; let corte = -1;
      for (let i = 0; i < t.length; i++) if (t[i] === ' ' && (corte < 0 || Math.abs(i - meio) < Math.abs(corte - meio))) corte = i;
      return corte < 0 ? [t] : [t.slice(0, corte), t.slice(corte + 1)];
    };
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Esquema da área ${esc(area.nome)} e seus sistemas">
      ${nos.map((p) => `<line class="ligacao ${p.s.demo ? 'pronta' : ''}" x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}"/>`).join('')}
      <g class="no-centro"><circle cx="${cx}" cy="${cy}" r="58"/><image href="${iconeArea(area)}" x="${cx - 40}" y="${cy - 40}" width="80" height="80"/></g>
      ${nos.map((p) => {
        const ls = linhas(p.s.nome), w = Math.max(...ls.map((l) => l.length)) * 8.4 + 24, h = ls.length * 17 + 18;
        const x = Math.min(W - w / 2 - 4, Math.max(w / 2 + 4, p.x)), y = Math.min(H - h / 2 - 8, Math.max(h / 2 + 4, p.y));
        return `<g class="no" tabindex="0" role="link" data-alvo="${p.s.id}" aria-label="${esc(p.s.nome)}">
          <rect x="${x - w / 2}" y="${y - h / 2 + 4}" width="${w}" height="${h}" rx="12" fill="${area.cor}" opacity=".9"/>
          <rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="12" fill="${p.s.demo ? '#fff' : '#FFF6D6'}"/>
          <text x="${x}" y="${y - (ls.length - 1) * 8.5 + 5}" text-anchor="middle">${ls.map((l, i) => `<tspan x="${x}" dy="${i ? 17 : 0}">${esc(l)}</tspan>`).join('')}</text></g>`;
      }).join('')}
    </svg>`;

    const prontas = sistemas.filter((s) => s.demo).length;
    pagina.insertAdjacentHTML('beforeend', `
      <section class="conteudo area-cabeca">
        <div>
          <div class="titulo"><img class="icone-area g" src="${iconeArea(area)}" alt=""><div><span class="chip claro">Área</span><h1>${esc(area.nome)}</h1></div></div>
          <p>${esc(area.resumo)}</p>
          <div class="flex"><span class="chip">${sistemas.length} ${sistemas.length > 1 ? 'sistemas' : 'sistema'}</span><span class="chip" style="background:var(--verde)">${prontas} ${prontas === 1 ? 'demo pronta' : 'demos prontas'}</span>${sistemas.length - prontas ? `<span class="chip" style="background:var(--amarelo);color:var(--tinta)">${sistemas.length - prontas} em roteiro</span>` : ''}</div>
        </div>
        <div class="bloco radial">${svg}<div class="legenda"><span>demo pronta</span><span class="r">roteiro</span></div></div>
      </section>`);
    pagina.querySelectorAll('.radial .no').forEach((g) => {
      const ir = () => document.getElementById(g.dataset.alvo).scrollIntoView({ behavior: SQ.reduzMovimento ? 'auto' : 'smooth' });
      g.addEventListener('click', ir); g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ir(); } });
    });

    // ---------- casos ----------
    const sec = el('section', { class: 'secao conteudo', style: { paddingTop: '28px' } },
      el('div', { class: 'secao-titulo', html: '<div><h2>Casos da área</h2><p>Esquema de cada sistema: interação → visualização → papel da IA → aprendizagem.</p></div>' }));
    for (const s of sistemas) {
      sec.append(el('article', { class: 'bloco caso', id: s.id, html: `
        <div class="caso-topo">
          <div><h2>${esc(s.nome)}</h2><div class="flex">${estrelas(s.potencial)}<span class="selo-status ${s.demo ? 'pronta' : 'roteiro'}">${s.demo ? '● Demo pronta' : '◐ Roteiro'}</span>${(s.tags || []).map((t) => `<span class="chip claro">${esc(t)}</span>`).join('')}</div></div>
        </div>
        <p class="resumo">${esc(s.resumo || '')}</p>
        ${SQ.fluxoHTML(s, s.interacao)}
        <div class="base">
          <div><h3>Objetivos de aprendizagem</h3><ul>${(s.objetivos || []).map((o) => `<li>${esc(o)}</li>`).join('')}</ul></div>
          <div>${s.demo
            ? `<h3>O que dá para fazer na demo</h3><p class="mb0">${esc(maiuscula(s.visualizar))} — com o guia ${esc(s.ia)}.</p>`
            : `<h3>Roteiro da demonstração</h3><ol>${(s.roteiro || []).map((o) => `<li>${esc(o)}</li>`).join('')}</ol>`}</div>
          <div class="acao">${s.demo
            ? `<a class="botao" href="${s.demo}">Abrir demonstração</a>`
            : `<span class="botao branco" aria-disabled="true" style="cursor:default">Em roteiro</span><span class="miudo texto-suave">Esquema pronto; a demo segue o roteiro ao lado.</span>`}</div>
        </div>` }));
    }
    pagina.append(sec);

    // ---------- outras áreas ----------
    pagina.append(el('section', { class: 'secao conteudo' },
      el('div', { class: 'secao-titulo', html: '<div><h2>Outras áreas</h2></div>' }),
      el('nav', { class: 'outras', 'aria-label': 'Áreas' }, ...dados.AREAS.map((a) => el('a', { href: `area.html?a=${a.id}`, 'aria-current': a.id === area.id ? 'page' : null },
        el('img', { src: iconeArea(a), alt: '' }), a.nome)))));
    if (location.hash) setTimeout(() => document.getElementById(location.hash.slice(1))?.scrollIntoView(), 50);
  })();
  </script>
</body>
</html>
